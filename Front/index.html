<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
  <main class="container mt-5">
    <section class="section-is-medium">
      <div class="columns">
        <div class="column is-8 is-offset-2">
          <form class="form box">
              <h1 class="title"> Conversão de DOC para PDF. </h1>
              <h2 class="subtitle mt-3">
                Faça o upload de arquivos doc, docx e odt para conversão de arquivos PDF.
              </h2>
              <div id="message"></div>
              <div class="column is-4 is-offset-4">
                <div class="file is-small is-boxed has-name">
                  <label class="file-label">
                    <input class="file-input" type="file" name="resume" />
                    <span class="file-cta">
                      <span class="file-icon">
                        <i class="fas fa-upload"></i>
                      </span>
                      <span class="file-label">Clique para o upload</span>
                    </span>
                    <span class="file-name"></span>
                  </label>
                </div>
              </div>
              <div class="column is-3">
                <div class="control">
                  <input type="submit" class="button is-primary" value="Enviar" />
                </div>
              </div>
          </form>
        </div>
      </div>
    </section>
  </main>
  <script src="index.js"></script>
</body>

</html>
